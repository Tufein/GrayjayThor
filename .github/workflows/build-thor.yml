name: Build and test Thor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-thor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same steps as scripts/build-thor.sh, but arm64-v8a only to keep CI fast.
      - name: Fetch the pinned submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 4 -- \
            dep/futopay app/src/stable/assets/sources

      - name: Build the Thor APK and run the Thor unit tests
        run: >
          ./gradlew :app:assembleThorDebug :app:testThorDebugUnitTest
          -PtargetAbis=arm64-v8a
          --tests 'com.futo.platformplayer.thor.*'
          --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: thor-arm64-debug-apk
          path: app/build/outputs/apk/thor/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thor-unit-test-reports
          path: app/build/test-results/testThorDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
