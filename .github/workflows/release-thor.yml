name: Release Thor (signed)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v396-thor.0.2.0
        required: true
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-thor
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_BASE64: ${{ secrets.THOR_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.THOR_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.THOR_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.THOR_KEY_PASSWORD }}
    steps:
      - name: Check the signing secrets exist
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v (THOR_* repository secrets)"; exit 1; }
          done

      - name: Check the tag is new
        run: |
          if gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release ${{ inputs.tag }} already exists"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch the pinned submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 --jobs 4 -- \
            dep/futopay app/src/stable/assets/sources

      - name: Install the signing key
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/thor.jks"
          # app/build.gradle reads its signing config from /opt/key.properties
          sudo mkdir -p /opt
          {
            echo "storeFile=$RUNNER_TEMP/thor.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } | sudo tee /opt/key.properties >/dev/null

      # The unit tests already run in the "Build and test Thor" workflow. Building only
      # the release variant, with a larger heap, avoids the Kotlin compiler running out
      # of memory on the 7 GB runner.
      - name: Build the signed release APK
        run: >
          ./gradlew :app:assembleThorRelease
          -PtargetAbis=arm64-v8a
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
          -Pkotlin.daemon.jvmargs=-Xmx3g
          --stacktrace

      - name: Verify the signature and collect the files
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/thor/release/*arm64-v8a*release*.apk | head -n1)
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee signature.txt
          mkdir -p dist
          name="Grayjay-Thor-${{ inputs.tag }}-arm64.apk"
          cp "$apk" "dist/$name"
          cp LICENSE.md THOR.md dist/
          cp signature.txt dist/apk-signature.txt
          (cd dist && sha256sum "$name" LICENSE.md THOR.md apk-signature.txt > SHA256SUMS.txt)
          ls -l dist

      - name: Create the GitHub release
        run: >
          gh release create "${{ inputs.tag }}"
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "Grayjay Thor ${{ inputs.tag }}"
          --generate-notes
          ${{ inputs.prerelease && '--prerelease' || '' }}
          dist/*

      - name: Remove the signing key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/thor.jks"
          sudo rm -f /opt/key.properties
